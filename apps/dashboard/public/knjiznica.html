<!doctype html>
<html lang="hr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Knjižnica materijala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="poslovanje.css">
<script src="ploca.js"></script>
<style>
/* Knjižnica: vlastite snimke i fotografije za objave. Claude vidi samo ono što je označeno kao slobodno. */
main.omot { display: flex; flex-direction: column; gap: 28px; padding-block: 26px 60px; }
.ucitaj { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; }
.ucitaj h2 { font-size: 22px; }
.kvacica { display: flex; gap: 10px; align-items: flex-start; font-size: 14.8px; line-height: 1.45; }
.kvacica input { width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; }
.kvacica[aria-disabled="true"] { color: var(--ink-soft); }
.napredak { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.napredak progress { width: 100%; height: 8px; }
.mreza { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; align-items: start; }
.stavka-k { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.stavka-k .prikaz { background: #1f1b24; aspect-ratio: 4 / 5; display: grid; place-items: center; color: #d9d2c8; font-size: 13px; }
.stavka-k .prikaz img, .stavka-k .prikaz video { width: 100%; height: 100%; object-fit: cover; display: block; }
.stavka-k .tijelo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.redak { display: flex; flex-wrap: wrap; gap: 6px; }
.stavka-k form { display: flex; flex-direction: column; gap: 8px; }
.stavka-k input[type="text"], .stavka-k select { width: 100%; border: 1px solid var(--line-strong); border-radius: 3px; padding: 7px 9px; font: inherit; font-size: 14px; }
.stavka-k .kvacica { font-size: 13.8px; }
.akcije { display: flex; flex-wrap: wrap; gap: 8px; }
</style>

<header class="zaglavlje">
  <div class="omot">
    <div class="red-zaglavlja">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="nadnaslov">Mreže i marketing · <span id="zakupac">knjižnica</span></span>
        <h1>Knjižnica materijala</h1>
        <span class="sitno">Tvoje snimke i fotografije za objave. Claude koristi samo ono što označiš da smije u objavu. Snimku s prepoznatljivim djetetom bez pisanog pristanka roditelja ploča ne pušta u objave.</span>
      </div>
      <a class="btn" href="/objave.html">Objave</a>
    </div>
  </div>
</header>

<main class="omot">
  <section class="kartica ucitaj" aria-labelledby="h-ucitaj">
    <h2 id="h-ucitaj">Učitaj s mobitela</h2>
    <div class="polje"><label for="datoteke">Snimke ili fotografije (najviše 95 MB po datoteci, snimaj u 1080p)</label>
      <input id="datoteke" type="file" accept="video/*,image/*" multiple></div>
    <div class="mreza-polja" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))">
      <div class="polje"><label for="usluga">Za što je</label>
        <select id="usluga"><option value="banneri">Banneri i šivanje</option><option value="igraonica">Igraonica</option><option value="oboje">Oboje</option></select></div>
      <div class="polje"><label for="opis">Što je na snimci</label><input id="opis" type="text" maxlength="500" placeholder="Npr. kroj slova L, škare kroz ružičastu tkaninu"></div>
    </div>
    <label class="kvacica"><input type="checkbox" id="djeca"><span>Na snimci je prepoznatljivo dijete</span></label>
    <label class="kvacica" id="l-pristanak" aria-disabled="true"><input type="checkbox" id="pristanak" disabled><span>Imam pisani pristanak roditelja za objavu</span></label>
    <label class="kvacica" id="l-slobodno"><input type="checkbox" id="slobodno" checked><span>Smije u objave</span></label>
    <div class="akcije"><button class="btn glavni" type="button" id="posalji">Učitaj</button></div>
    <div class="napredak" id="napredak" hidden><span id="napredak-tekst"></span><progress id="napredak-traka" max="100" value="0"></progress></div>
    <p class="poruka" id="poruka" aria-live="polite" style="margin:0"></p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" aria-labelledby="h-sve">
    <h2 id="h-sve" style="font-size:24px">U knjižnici</h2>
    <div class="mreza" id="stavke"><p class="prazno">Učitavam…</p></div>
  </section>
</main>

<script src="zajednicko.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = P.esc;
  var TEN = null; try { TEN = localStorage.getItem('tenant'); } catch (e) {}
  var stavke = [], brisanje = null;
  var USLUGA = { banneri: 'Banneri', igraonica: 'Igraonica', oboje: 'Oboje' };
  var PO_NASTAVKU = { mp4: 'video/mp4', mov: 'video/quicktime', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic' };

  function medij(k) { return '/api/mediji/' + k.split('/').map(encodeURIComponent).join('/') + (TEN ? '?tenant=' + encodeURIComponent(TEN) : ''); }
  function mb(b) { return (b / 1048576).toLocaleString('hr-HR', { maximumFractionDigits: 1 }) + ' MB'; }

  // Dijete bez pristanka ne smije u objave: kvačice se zaključavaju.
  function uskladi(djeca, pristanak, slobodno, lp) {
    pristanak.disabled = !djeca.checked;
    if (!djeca.checked) pristanak.checked = false;
    if (lp) lp.setAttribute('aria-disabled', String(!djeca.checked));
    var zabrana = djeca.checked && !pristanak.checked;
    if (zabrana) slobodno.checked = false;
    slobodno.disabled = zabrana;
  }
  ['djeca', 'pristanak'].forEach(function (id) { $('#' + id).addEventListener('change', function () { uskladi($('#djeca'), $('#pristanak'), $('#slobodno'), $('#l-pristanak')); }); });

  function posaljiJednu(f, i, n) {
    return new Promise(function (ok, ne) {
      var mime = f.type || PO_NASTAVKU[(f.name.split('.').pop() || '').toLowerCase()] || '';
      var q = new URLSearchParams({ usluga: $('#usluga').value, opis: $('#opis').value.trim(), djeca: $('#djeca').checked ? '1' : '0',
        pristanak: $('#pristanak').checked ? '1' : '0', slobodno: $('#slobodno').checked ? '1' : '0', naziv: f.name });
      if (TEN) q.set('tenant', TEN);
      var x = new XMLHttpRequest();
      x.open('PUT', '/api/knjiznica/datoteka?' + q.toString());
      x.setRequestHeader('content-type', mime);
      x.setRequestHeader('x-ploca-ucitavanje', '1');
      if (TEN) x.setRequestHeader('x-tenant', TEN);
      x.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        $('#napredak-traka').value = Math.round((e.loaded / e.total) * 100);
        $('#napredak-tekst').textContent = 'Učitavam ' + (i + 1) + ' od ' + n + ': ' + f.name + ' (' + mb(e.loaded) + ' od ' + mb(e.total) + ')';
      };
      x.onload = function () {
        var d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
        if (x.status >= 200 && x.status < 300) ok(d); else ne(new Error(f.name + ': ' + (d.greska || 'greška ' + x.status)));
      };
      x.onerror = function () { ne(new Error(f.name + ': veza je prekinuta.')); };
      x.send(f);
    });
  }
  $('#posalji').onclick = function () {
    var dat = Array.prototype.slice.call($('#datoteke').files || []);
    if (!dat.length) { P.poruka($('#poruka'), 'Odaberi barem jednu datoteku.', 'greska'); return; }
    var velike = dat.filter(function (f) { return f.size > 95 * 1048576; });
    if (velike.length) { P.poruka($('#poruka'), 'Prevelike datoteke (više od 95 MB): ' + velike.map(function (f) { return f.name; }).join(', ') + '. Snimaj u 1080p ili skrati snimku.', 'greska'); return; }
    var b = this; b.disabled = true; $('#napredak').hidden = false; P.poruka($('#poruka'), '');
    var greske = [], gotovo = 0;
    dat.reduce(function (lanac, f, i) {
      return lanac.then(function () { return posaljiJednu(f, i, dat.length).then(function () { gotovo++; }, function (e) { greske.push(e.message); }); });
    }, Promise.resolve()).then(function () {
      b.disabled = false; $('#napredak').hidden = true; $('#datoteke').value = '';
      P.poruka($('#poruka'), greske.length ? 'Učitano ' + gotovo + ' od ' + dat.length + '. ' + greske.join(' ') : 'Učitano: ' + gotovo + '.', greske.length ? 'greska' : 'ok');
      return ucitaj();
    });
  };

  function karta(k) {
    var prikaz = k.vrsta === 'video'
      ? '<video preload="metadata" muted playsinline controls src="' + esc(medij(k.kljuc)) + '"></video>'
      : (k.mime === 'image/heic' ? '<span>HEIC fotografija</span>' : '<img loading="lazy" alt="' + esc(k.opis || k.naziv || 'Fotografija') + '" src="' + esc(medij(k.kljuc)) + '">');
    var znakovi = '<div class="redak"><span class="chip">' + esc(USLUGA[k.usluga] || k.usluga) + '</span>' +
      (k.slobodno ? '<span class="chip ok">Smije u objave</span>' : '<span class="chip nepoznato">Ne ide u objave</span>') +
      (k.imaDjece ? '<span class="chip ' + (k.pristanak ? 'ok' : 'kriticno') + '">' + (k.pristanak ? 'Dijete, ima pristanak' : 'Dijete, bez pristanka') + '</span>' : '') + '</div>';
    var brisi = brisanje === k.id
      ? '<button class="btn malo opasno" type="button" data-brisi-potvrda="' + esc(k.id) + '">Potvrdi brisanje</button><button class="btn malo" type="button" data-odustani="1">Odustani</button>'
      : '<button class="btn malo" type="button" data-brisi="' + esc(k.id) + '">Obriši</button>';
    return '<article class="kartica stavka-k"><div class="prikaz">' + prikaz + '</div><div class="tijelo">' + znakovi +
      '<form data-uredi="' + esc(k.id) + '"><input type="text" name="opis" maxlength="500" aria-label="Što je na snimci" value="' + esc(k.opis || '') + '" placeholder="Što je na snimci">' +
      '<select name="usluga" aria-label="Za što je">' + Object.keys(USLUGA).map(function (u) { return '<option value="' + u + '"' + (u === k.usluga ? ' selected' : '') + '>' + USLUGA[u] + '</option>'; }).join('') + '</select>' +
      '<label class="kvacica"><input type="checkbox" name="djeca"' + (k.imaDjece ? ' checked' : '') + '><span>Prepoznatljivo dijete</span></label>' +
      '<label class="kvacica"><input type="checkbox" name="pristanak"' + (k.pristanak ? ' checked' : '') + (k.imaDjece ? '' : ' disabled') + '><span>Pisani pristanak roditelja</span></label>' +
      '<label class="kvacica"><input type="checkbox" name="slobodno"' + (k.slobodno ? ' checked' : '') + (k.imaDjece && !k.pristanak ? ' disabled' : '') + '><span>Smije u objave</span></label>' +
      '<div class="akcije"><button class="btn malo" type="submit">Spremi</button>' + brisi + '</div></form>' +
      '<span class="sitno" style="font-size:12.5px">' + esc(k.naziv || '') + ' · ' + mb(k.velicina) + ' · ' + P.datum(k.kreirano) + '</span></div></article>';
  }
  function crtaj() {
    $('#stavke').innerHTML = stavke.length ? stavke.map(karta).join('') : '<p class="prazno">Knjižnica je prazna. Učitaj prve snimke šivanja, pakiranja ili postavljanja igraonice.</p>';
  }
  function ucitaj() { return P.api('GET', '/api/knjiznica').then(function (d) { stavke = d.stavke; crtaj(); }); }

  document.addEventListener('change', function (e) {
    var f = e.target.closest('form[data-uredi]'); if (!f) return;
    uskladi(f.elements.djeca, f.elements.pristanak, f.elements.slobodno, null);
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-uredi]'); if (!f) return;
    e.preventDefault();
    P.api('POST', '/api/knjiznica/' + f.dataset.uredi, { opis: f.elements.opis.value.trim(), usluga: f.elements.usluga.value,
      imaDjece: f.elements.djeca.checked, pristanak: f.elements.pristanak.checked, slobodno: f.elements.slobodno.checked })
      .then(function () { P.poruka($('#poruka'), 'Spremljeno.', 'ok'); return ucitaj(); })
      .catch(function (er) { P.poruka($('#poruka'), er.message, 'greska'); });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.brisi) { brisanje = b.dataset.brisi; crtaj(); }
    else if (b.dataset.odustani) { brisanje = null; crtaj(); }
    else if (b.dataset.brisiPotvrda) {
      P.api('POST', '/api/knjiznica/' + b.dataset.brisiPotvrda + '/obrisi', {})
        .then(function () { brisanje = null; P.poruka($('#poruka'), 'Obrisano.', 'ok'); return ucitaj(); })
        .catch(function (er) { P.poruka($('#poruka'), er.message, 'greska'); });
    }
  });

  ucitaj().catch(function (e) { $('#stavke').innerHTML = ''; P.poruka($('#poruka'), e.message, 'greska'); });
})();
</script>
